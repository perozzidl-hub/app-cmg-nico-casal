<!-- En la sección de carga -->
<section class="upload-area" id="uploadArea">
  <div class="upload-box">
    <i class="fas fa-cloud-upload-alt fa-3x"></i>
    <h4>Cargar Base de Datos</h4>
    <p>Sube un único archivo Excel (con encabezados en cualquier fila).</p>
    <input type="file" accept=".xlsx,.xls" />
    <span class="file-status-msg">No cargado</span>
  </div>
  <div class="upload-actions">
    <button id="loadRepoBtn" class="btn-primary"><i class="fas fa-database"></i> Cargar Datos del Repositorio</button>
  </div>
  <div id="fileStatus" class="file-status">Cargando datos automáticamente desde el repositorio...</div>
</section>
